version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major bumps of the MCP SDK are protocol-relevant: review manually.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: [version-update:major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
